<section id="contact" class="py-5">
  <div class="container">
    <div class="text-center mb-4" appReveal>
      <h2 class="section-title display-5">اتصل بنا</h2>
      <p class="text-secondary mb-0">خدمة التوصيل متاحة، كلمنا أو ابعتلنا واتساب</p>
    </div>
    <div class="row g-3 justify-content-center">
      @for (p of phones; track p; let i = $index) {
        <div class="col-12 col-md-6 col-lg-3" appReveal [revealDelay]="i * 120">
          <div class="card h-100 d-flex justify-content-center align-items-center p-3">
            <i class="fa-solid fa-phone-volume fs-2 text-pink mb-2"></i>
            <b dir="ltr" class="fs-5">{{ p }}</b>
            <div class="d-flex gap-2 justify-content-center mt-3">
              <a class="btn btn-brand btn-sm rounded-pill px-3" [href]="'tel:' + p"><i class="fa-solid fa-phone ms-1"></i>اتصال</a>
              <a class="btn btn-success btn-sm rounded-pill px-3" [href]="wa(p)" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp ms-1"></i>واتساب</a>
            </div>
          </div>
        </div>
      }
      @for (b of branches; track b; let i = $index) {
        <div class="col-12 col-md-6 col-lg-3" appReveal [revealDelay]="(i + phones.length) * 120">
          <div class="card h-100 d-flex justify-content-center align-items-center p-3">
            <i class="fa-solid fa-location-dot fs-2 text-pink mb-2"></i>
            <small class="text-cyan">فرع {{ i + 1 }}</small>
            <b>{{ b }}</b>
          </div>
        </div>
      }
    </div>
  </div>
</section>
